# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: desktop-shell
  name: dsh-plugin-desktop
  config:
    mode: advanced
    macosMaterial: transparent
    windowsMaterial: off
    openBrowser: false
    networkExposure: loopback
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
        systemPromptUpdate: in-history
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: queue
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      yzapi:
        displayName: 柚子API
        apiKeyEnv: YZAPI_API_KEY
        api: openai-completions
        baseURL: https://yzai.pro
        models:
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
          - id: gpt-5.6-terra
            name: GPT-5.6 Terra
          - id: gpt-5.5
            name: GPT-5.5
          - id: codex-auto-review
            name: Codex Auto Review
      gemini:
        displayName: Google
        apiKeyEnv: GEMINI_API_KEY
        api: anthropic-messages
        baseURL: http://localhost:8787
        models:
          - id: gemini-3.8-flash-high
            name: Gemini-3.8-Flash-High
            maxTokens: 64000
            contextWindow: 1000000
          - id: gemini-3.8-flash-medium
            name: Gemini-3.8-Flash-Medium
            maxTokens: 64000
            contextWindow: 1000000
          - id: gemini-3.8-flash-low
            name: Gemini-3.8-Flash-Low
            maxTokens: 64000
            contextWindow: 1000000
          - id: gemini-3.8-flash-tiered
            name: Gemini-3.8-Flash-Tiered
            maxTokens: 64000
            contextWindow: 1000000
      commandcode:
        displayName: CommandCode
        apiKeyEnv: COMMANDCODE_API_KEY
        api: openai-completions
        baseURL: http://localhost:8787/v1
        reasoning: high
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            input:
              - text
              - image
            contextWindow: 1000000
            maxTokens: 200000
            compat:
              thinkingFormat: deepseek
              maxTokensField: max_tokens
            reasoningEfforts:
              low: low
              high: high
              max: max
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: standard
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: llm-deepseek-account
  name: "@deepseek-ai/dsh-llm-deepseek-account"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models: []
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    autoOpenSubagent: false
    autoOpenJobs: false
    agentOpenTools: true
    workspaceFence: false
    tabsEnabled:
      diff: false
      git: true
- id: vibrancy-skin
  disabled: false
